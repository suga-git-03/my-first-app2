<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STARBOUND RUNNER</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="STARBOUND RUNNER home">
        <span class="brand-mark">✦</span>
        <span>STARBOUND <b>RUNNER</b></span>
      </a>
      <div class="status-chip"><span class="status-dot"></span>SECTOR 01 / LIVE</div>
    </header>

    <section class="hero">
      <div class="intro">
        <p class="eyebrow">SIDE-SCROLLING ACTION / MVP</p>
        <h1>RUN TOWARD<br><em>THE LIGHT.</em></h1>
        <p class="lead">星降る峡谷を駆け抜け、光のゲートを目指せ。<br>敵をかわし、スターを集めよう。</p>
        <div class="controls" aria-label="操作方法">
          <span><kbd>A</kbd><kbd>D</kbd> 移動</span>
          <span><kbd>W</kbd> <kbd>SPACE</kbd> ジャンプ</span>
          <span><kbd>J</kbd> 攻撃</span>
        </div>
      </div>

      <div class="game-card">
        <div class="game-header">
          <span class="game-label">MISSION <b>01</b></span>
          <span id="mission-status">REACH THE GATE</span>
        </div>
        <div class="canvas-wrap">
          <canvas id="game" width="960" height="540" aria-label="STARBOUND RUNNER game"></canvas>
          <div id="game-message" class="game-message hidden">
            <p class="message-kicker">MISSION COMPLETE</p>
            <h2>LIGHT FOUND.</h2>
            <button id="restart-button" type="button">REPLAY <span>↗</span></button>
          </div>
        </div>
        <div class="game-footer">
          <div><span class="footer-label">DISTANCE</span><strong id="distance">0000</strong><small> M</small></div>
          <div><span class="footer-label">STARS</span><strong id="stars">0</strong><small> / 5</small></div>
          <button id="pause-button" class="pause-button" type="button">Ⅱ PAUSE</button>
        </div>
      </div>
    </section>

    <footer class="page-footer">
      <span>© 2024 STARBOUND SYSTEMS</span>
      <span>BUILD 0.1.0 / PRESS <b>R</b> TO RESTART</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
